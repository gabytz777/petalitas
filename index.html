<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
}

#main {
    flex: 2;
    padding: 20px;
    overflow-y: auto;
}

#chat {
    flex: 1;
    border-left: 2px solid #ddd;
    display: flex;
    flex-direction: column;
}

#messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #fafafa;
}

.msg {
    margin: 6px 0;
}

#inputBox {
    display: flex;
    border-top: 1px solid #ddd;
}

#msgInput {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
}

button {
    padding: 10px;
    border: none;
    background: #ff4da6;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #e60073;
}
</style>
</head>

<body>

<!-- LEFT SIDE -->
<div id="main">
    <h1>hub</h1>

    <ul>
        <li><a href="notepad.html">Useless Notepad</a></li>
        <li><a href="paintapp.html">Bad Paint App</a></li>
        <li><a href="dvd.html">DVD Bouncer</a></li>
        <li><a href="https://streamduck.site" target="_blank">my free movie site</a></li>
    </ul>
</div>

<!-- CHAT -->
<div id="chat">
    <div id="messages"></div>

    <div id="inputBox">
        <input id="msgInput" placeholder="type message..." />
        <button onclick="sendMsg()">Send</button>
    </div>
</div>

<script>
const API = "https://petalitasbackend-production.up.railway.app";

let lastSendTime = 0;
const COOLDOWN = 2000;

/* =====================
   USERNAME SYSTEM
===================== */
let username = localStorage.getItem("username");

if (!username) {
    username = prompt("Enter username:");
    if (!username || !username.trim()) username = "anonymous";
    localStorage.setItem("username", username);
}

/* =====================
   SITE DETECTION
===================== */
const SITE_NAME = window.location.hostname;

/* Ctrl + U change name */
document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        const newName = prompt("Edit username:", username);
        if (newName && newName.trim()) {
            username = newName.trim();
            localStorage.setItem("username", username);
        }
    }
});

/* =====================
   SEND MESSAGE
===================== */
async function sendMsg() {
    const now = Date.now();

    if (now - lastSendTime < COOLDOWN) {
        alert("Slow down!");
        return;
    }

    const input = document.getElementById("msgInput");
    const text = input.value.trim();

    if (!text) return;

    lastSendTime = now;

    await fetch(API + "/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            user: username,
            text: text,
            source: SITE_NAME
        })
    });

    input.value = "";
}

/* Enter key */
document.getElementById("msgInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMsg();
});

/* =====================
   LOAD MESSAGES
===================== */
async function loadMessages() {
    const res = await fetch(API + "/messages");
    const data = await res.json();

    const box = document.getElementById("messages");
    box.innerHTML = "";

    data.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg";

        div.innerHTML = `
            <small>[${m.source || "unknown"}]</small>
            <b>${escapeHtml(m.user)}</b>: ${escapeHtml(m.text)}
        `;

        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

setInterval(loadMessages, 2000);
loadMessages();
</script>

</body>
</html>
